{% extends 'base.html' %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Inventory Manager</h1>

    <a href="/add"><button>Add an item</button></a>

    {% for item in items %}
        <h3>{{item.name}}</h3>
        <h5>{{item.description}}</h5>
        <h5>Amount: {{item.quantity}}</h5>
        <p>Price: {{item.price}}</p>
    {% endfor %}

{% endblock %}
