{% extends 'base.html' %}

{% block title %}Inventory Manager{% endblock %}

{% block content %}
    <h1>Products</h1>
    
    <a href="{% url 'create_product' %}"><button type="submit">Add Item</button></a>
    <a href="{% url 'home' %}"><button type="submit">Exit System</button></a>
<hr>
    <table>
        <thead>
            <tr>Name</tr>
            <tr>SKU</tr>
            <tr>Price</tr>
            <tr>Quantity</tr>
            <tr>Delete</tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{product.product_name}}</td>
                    <td>{{product.product_quantity}}</td>
                    <td>${{product.product_price}}</td>
                    <td>{{product.product_sku}}</td>
                    <td>
                        
                        <a href="{% url 'create_product' %}"><button>Update</button></a>
                        <a href="{% url 'delete_product' product.id %}"><button>Delete</button></a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    
{% endblock %}
